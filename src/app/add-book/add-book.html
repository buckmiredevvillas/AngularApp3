
<h2>Add New Book</h2>

<form (ngSubmit)="saveBook()">

  <!-- Book title -->
  <p>
    <label for="title">Book Title:</label><br>
    <input
      type="text"
      id="title"
      name="title"
      [(ngModel)]="book.title"
      required>
  </p>

  <!-- Author -->
  <p>
    <label for="author">Author:</label><br>
    <input
      type="text"
      id="author"
      name="author"
      [(ngModel)]="book.author"
      required>
  </p>

  <!-- Description -->
  <p>
    <label for="description">Description:</label><br>
    <textarea
      id="description"
      name="description"
      [(ngModel)]="book.description">
    </textarea>
  </p>

  <!-- Book-cover image upload -->
  <p>
    <label for="image">Book Cover Image:</label><br>
    <input
      type="file"
      id="image"
      name="image"
      accept="image/jpeg,image/png,image/webp"
      (change)="onFileSelected($event)">
  </p>

  <!-- Display errors only when needed -->
  @if (errorMessage) {
    <p>{{ errorMessage }}</p>
  }

  <button type="submit">Save Book</button>

</form>

<p>
  <a href="/list">View All Books</a>
</p>
