
<h2>Delete Book</h2>

<p>Book ID: {{ bookId }}</p>
<p>Book Title: {{ bookTitle }}</p>
<p>Error: {{ errorMessage }}</p>


<p>{{ errorMessage }}</p>

@if (bookId !== null && bookTitle) {
  <p>Are you sure you want to delete this book?</p>

  <h3>{{ bookTitle }}</h3>

  <button type="button" (click)="deleteBook()">
    Yes, Delete Book
  </button>
}

<button type="button" (click)="cancel()">
  Cancel
</button>
