
<div class="book-list">
  <h2>My Book Browser</h2>

  <!-- Navigate to the Add Book page -->
  <p>
    <a routerLink="/add">Add New Book</a>
  </p>

  <h2>All Books</h2>

  <!-- Display books retrieved from MySQL -->
  @if (books$ | async; as books) {
    @for (book of books; track book.id) {
      <div class="book">
        <h3>{{ book.title }}</h3>
        <p><strong>Author:</strong> {{ book.author }}</p>
        <p>{{ book.description }}</p>

        <!-- Open the update page for this book -->
        <a [routerLink]="['/update']"
           [queryParams]="{ id: book.id }">
          Edit
        </a>

        &nbsp;&nbsp;

        <!-- Open the delete confirmation page -->
        <a [routerLink]="['/delete']"
           [queryParams]="{ id: book.id }">
          Delete
        </a>
      </div>
    } @empty {
      <p>No books found.</p>
    }
  } @else {
    <p>Loading books...</p>
  }
</div>
