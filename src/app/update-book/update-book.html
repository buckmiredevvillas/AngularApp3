

<h2>Update Book</h2>

@if (errorMessage) {
  <p>{{ errorMessage }}</p>
}

<form (ngSubmit)="saveBook()">

  <div>
    <label for="title">Book Title:</label><br>
    <input
      type="text"
      id="title"
      name="title"
      [(ngModel)]="book.title"
      required>
  </div>

  <br>

  <div>
    <label for="author">Author:</label><br>
    <input
      type="text"
      id="author"
      name="author"
      [(ngModel)]="book.author"
      required>
  </div>

  <br>

  <div>
    <label for="description">Description:</label><br>
    <textarea
      id="description"
      name="description"
      [(ngModel)]="book.description"
      required>
    </textarea>
  </div>

  <br>

  <button type="submit" [disabled]="bookId === null || !!errorMessage">
    Update Book
  </button>

</form>
